[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codelith"
version = "0.1.0"
description = "A multi-agent AI mentor that blends coding assistance with adaptive teaching."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Himani Bagale", email = "himanibagale@gmail.com" },
]
keywords = ["ai", "tutor", "mentor", "coding-assistant", "langgraph", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "langgraph",
    "langchain-core",
    "keyring",
]

[project.urls]
Homepage = "https://github.com/MakersNeedMore-MnM/Round2-himanibagale"
Repository = "https://github.com/MakersNeedMore-MnM/Round2-himanibagale"

[project.scripts]
codelith = "backend.cli.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

# The built dashboard is part of the package: frontend's Vite build
# writes backend/daemon/static (see frontend/vite.config.ts), and the
# daemon serves it from there (see backend/daemon/server.py).  Without
# package-data, setuptools ships only .py files and the wheel would
# install without a dashboard.
[tool.setuptools.package-data]
"backend.daemon" = ["static/**/*"]
